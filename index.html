<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Inc · Payments</title>
<meta name="description" content="Pay an order with Power Inc. Sample site for compatibility testing.">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#14171f; --muted:#5b6475; --brand:#2f5bea; --line:#e3e6ee; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  .logo { font-weight:700; font-size:20px; } .logo span { color:var(--brand); }
  nav a { color:var(--muted); text-decoration:none; margin-left:16px; font-size:14px; }
  main { max-width:960px; margin:0 auto; padding:32px 16px; display:grid; grid-template-columns: 1.2fr 1fr; gap:24px; }
  h1 { font-size:32px; margin:0 0 8px; } p { color:var(--muted); line-height:1.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:16px; cursor:pointer; }
  .summary div { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .summary .total { font-weight:700; border-bottom:0; }
  #status { margin-top:12px; font-size:14px; min-height:20px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } h1 { font-size:26px; } nav { display:none; } }
</style>
</head>
<body>
<header>
  <div class="logo">Power<span>Inc</span></div>
  <nav><a href="#">Orders</a><a href="#">Refunds</a><a href="#">Help</a></nav>
</header>
<main>
  <section>
    <h1>Pay for your order</h1>
    <p>Secure checkout for order <strong>#10482</strong>. Refunds go back to the same card within 5 working days.</p>
    <div class="card summary">
      <div><span>Wireless headphones</span><span>$89.00</span></div>
      <div><span>Shipping</span><span>$5.00</span></div>
      <div class="total"><span>Total</span><span>$94.00</span></div>
    </div>
  </section>
  <section class="card">
    <form id="pay" novalidate>
      <label for="name">Name on card</label>
      <input id="name" name="name" autocomplete="cc-name" required>
      <label for="card">Card number</label>
      <input id="card" name="card" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" required>
      <div class="row">
        <div><label for="exp">Expiry</label><input id="exp" name="exp" placeholder="MM/YY" autocomplete="cc-exp" required></div>
        <div><label for="cvc">CVC</label><input id="cvc" name="cvc" inputmode="numeric" autocomplete="cc-csc" required></div>
      </div>
      <button type="submit">Pay $94.00</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<footer>Sample site for compatibility testing. No real payments are taken.</footer>
<script>
  document.getElementById('pay').addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = this.checkValidity();
    document.getElementById('status').textContent = ok ? 'Payment received. Thank you!' : 'Please fill in every field.';
  });
</script>
</body>
</html>
